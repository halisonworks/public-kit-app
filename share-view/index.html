<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shared canvas · KIT Apps</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    html, body { margin: 0; height: 100%; background: #f8fafc; }
    #frame { width: 100%; height: 100vh; border: 0; display: none; }
    #msg { font-family: system-ui, -apple-system, sans-serif; padding: 2rem; color: #475569; }
    #footer {
      position: fixed; bottom: 10px; right: 12px; font: 11px system-ui, sans-serif;
      color: #94a3b8; background: rgba(255,255,255,.7); padding: 2px 8px; border-radius: 8px;
      text-decoration: none;
    }
    #footer:hover { color: #475569; }
  </style>
</head>
<body>
  <div id="msg">Loading shared canvas…</div>
  <!-- Sandboxed like the Studio canvas frame: shared code gets an opaque origin.
       Like the Studio shell, this page holds the canvas's data and serves it to
       the frame (see CanvasIframe.jsx / appData.js), keyed by a hash of the
       link: the same link gets its data back, two links never share it. -->
  <iframe id="frame" title="Shared canvas" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
  <a id="footer" href="https://halison.io/kit-apps" target="_blank" rel="noopener">Made with KIT Apps by Halison.io</a>
  <script>
    (function () {
      function fromB64Url(s) {
        var b = s.replace(/-/g, '+').replace(/_/g, '/');
        var bin = atob(b);
        var bytes = Uint8Array.from(bin, function (c) { return c.charCodeAt(0); });
        return new TextDecoder().decode(bytes);
      }
      function decode(frag) {
        try {
          var raw = (frag || '').replace(/^#/, '');
          if (!raw) return null;
          var o = JSON.parse(fromB64Url(raw));
          // v2 links carry a project (files + entry). The paths only name modules
          // inside the sandboxed frame; nothing is written anywhere.
          if (o && o.files && typeof o.files === 'object' && typeof o.files[o.entry] === 'string') {
            o.code = o.files[o.entry];
            return o;
          }
          if (!o || typeof o.code !== 'string') return null;
          return o;
        } catch (e) { return null; }
      }
      // Minimal mirror of src/utils/detectCanvasKind so the runtime gets the
      // right kind (full HTML doc vs component) without a transpile guess.
      function kindOf(code) {
        var t = (code || '').trimStart().replace(/^(?:<!--[\s\S]*?-->\s*)+/, '');
        if (/^(?:<!doctype\s+html|<html[\s>]|<head[\s>]|<body[\s>])/i.test(t)) return 'html';
        if (/\bexport\s+default\b|\bexport\s+(?:const|function|class)\b|^\s*import\s+[\s\S]*?from\s+["']/m.test(t)) return 'component';
        if (t.charAt(0) === '<' && /^<\s*(style|script|link|meta|title|div|main|section|article|header|footer|nav|h1|h2|p|ul|ol|table|form|button|canvas|svg)\b/i.test(t) && !/=>|\bfunction\b|className=/.test(t)) return 'html';
        return 'component';
      }

      // Mirror of shareStorageId in src/utils/shareLink.js.
      function storageIdOf(text) {
        return crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(text))).then(function (h) {
          return 'share-' + Array.from(new Uint8Array(h).slice(0, 12), function (b) { return b.toString(16).padStart(2, '0'); }).join('');
        });
      }

      // The canvas's localStorage under __cv__:<id>: and its appStudio.storage
      // in IndexedDB appstudio:<id>, same layout as the Studio shell.
      function readLocal(prefix) {
        var out = {};
        try {
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf(prefix) === 0) out[k.slice(prefix.length)] = localStorage.getItem(k);
          }
        } catch (e) { /* storage blocked: start empty */ }
        return out;
      }
      function writeLocal(prefix, d) {
        if (d.op === 'ls-set') localStorage.setItem(prefix + d.key, String(d.value));
        else if (d.op === 'ls-remove') localStorage.removeItem(prefix + d.key);
        else if (d.op === 'ls-clear') Object.keys(readLocal(prefix)).forEach(function (k) { localStorage.removeItem(prefix + k); });
      }
      var dbPromise = null;
      function idb(name, method, args) {
        if (!dbPromise) {
          dbPromise = new Promise(function (resolve, reject) {
            var req = indexedDB.open(name, 1);
            req.onupgradeneeded = function () { req.result.createObjectStore('kv'); };
            req.onsuccess = function () { resolve(req.result); };
            req.onerror = function () { reject(req.error); };
          });
        }
        return dbPromise.then(function (db) {
          return new Promise(function (resolve, reject) {
            var write = method === 'set' || method === 'remove' || method === 'clear';
            var t = db.transaction('kv', write ? 'readwrite' : 'readonly');
            var s = t.objectStore('kv');
            var a = args || [];
            var r, k2;
            if (method === 'get') r = s.get(a[0]);
            else if (method === 'set') r = s.put(a[1], a[0]);
            else if (method === 'remove') r = s.delete(a[0]);
            else if (method === 'keys') r = s.getAllKeys();
            else if (method === 'values') r = s.getAll();
            else if (method === 'clear') r = s.clear();
            else if (method === 'getAll') { k2 = s.getAllKeys(); r = s.getAll(); }
            else return reject(new Error('Unknown storage method "' + method + '".'));
            t.oncomplete = function () {
              if (write) return resolve(true);
              if (k2) { var o = {}; k2.result.forEach(function (k, i) { o[k] = r.result[i]; }); return resolve(o); }
              resolve(r.result);
            };
            t.onerror = function () { reject(t.error); };
            t.onabort = function () { reject(t.error || new Error('The storage write was aborted (storage may be full).')); };
          });
        });
      }

      var data = decode(location.hash);
      var msg = document.getElementById('msg');
      var frame = document.getElementById('frame');
      if (!data) {
        msg.textContent = 'This link does not contain a valid canvas.';
        return;
      }
      document.title = (data.name ? data.name.replace(/\.[^.]+$/, '') : 'Shared canvas') + ' · KIT Apps';

      storageIdOf(location.hash).then(function (id) {
        var prefix = '__cv__:' + id + ':';
        window.addEventListener('message', function (ev) {
          if (ev.source !== frame.contentWindow) return;
          var d = ev.data;
          if (!d || typeof d !== 'object') return;
          if (d.type === 'ready') {
            frame.contentWindow.postMessage({ type: 'render', code: data.code, files: data.files, entry: data.entry, kind: kindOf(data.code), storage: readLocal(prefix) }, '*');
            msg.style.display = 'none';
            frame.style.display = 'block';
          } else if (d.type === 'storage' && d.op === 'idb') {
            idb('appstudio:' + id, d.method, d.args).then(
              function (result) { frame.contentWindow.postMessage({ type: 'storage-result', id: d.id, result: result }, '*'); },
              function (err) { frame.contentWindow.postMessage({ type: 'storage-result', id: d.id, error: (err && err.message) || String(err) }, '*'); }
            );
          } else if (d.type === 'storage') {
            try { writeLocal(prefix, d); } catch (e) { /* quota full: the write is lost, as in a full browser store */ }
          }
        });
        // canvas-runtime is a sibling folder under the web root.
        frame.src = '../canvas-runtime/index.html';
      });
    })();
  </script>
</body>
</html>
